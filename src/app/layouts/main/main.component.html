<div class="flex min-h-screen bg-base-200/50 text-base-content overflow-x-hidden">

  @if (session) {
  <app-sidebar></app-sidebar>
  }

  <div class="flex flex-col flex-1 min-w-0 transition-all duration-300 ease-in-out" [ngClass]="{
      'ml-64': session && sidebarService.isOpen(),
      'ml-20': session && !sidebarService.isOpen(),
      'ml-0': !session
    }">

    <header class="sticky top-0 z-30 w-full bg-base-100/80 backdrop-blur-md border-b border-base-content/5">
      <app-navbar></app-navbar>
    </header>

    <main class="flex-1">
      <div class="p-2 md:p-4">
        <ng-content></ng-content>
      </div>
    </main>

    <footer class="shrink-0 border-t border-base-content/5 bg-base-100">
      <app-footer></app-footer>
    </footer>
  </div>

</div>
