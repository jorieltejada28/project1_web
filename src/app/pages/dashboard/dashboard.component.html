<app-main>
  <!-- Master Layout: 4 Columns -->
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-2 p-1">

    <!-- LEFT & MIDDLE SECTION (3/4 Width) -->
    <div class="lg:col-span-3 flex flex-col gap-2">

      <!-- Top Row: Line Graph + 2 Small Cards -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 items-stretch">
        <!-- Line Graph (2/3 of this sub-section) -->
        <div class="lg:col-span-2">
          <app-line-graph [data]="userTrends" xKey="date" yKey="total" title="Daily Registrations" height="300px"
            color="#3b82f6">
          </app-line-graph>
        </div>

        <!-- Stacked Small Cards (1/3 of this sub-section) -->
        <div class="lg:col-span-1 h-full">
          <!-- h-full here ensures the component container matches the line graph height -->
          <app-card-dashboard [stats]="stats" class="h-full"></app-card-dashboard>
        </div>
      </div>

      <!-- Bottom Row: Bar + Donut -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-2">
        <app-bar-chart [data]="revenueData" xKey="month" yKey="amount" title="Revenue by Month" height="300px"
          color="#f471b5"></app-bar-chart>

        <app-donut-chart [data]="browserData" labelKey="browser" valueKey="users" title="Device Distribution"
          height="292px"></app-donut-chart>

      </div>
    </div>

    <!-- RIGHT SECTION: Vertical Audit Trail (1/4 Width) -->
    <div class="lg:col-span-1">
      <app-audit-trail [auditLogs]="auditLogs"></app-audit-trail>
    </div>

  </div>
</app-main>
