<app-main>
  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="card w-full max-w-xl bg-base-100 shadow-2xl border border-base-content/5 backdrop-blur-sm">
      <div class="card-body items-center text-center p-16">

        <div
          class="w-20 h-20 bg-primary/10 text-primary rounded-3xl flex items-center justify-center mb-6 border border-primary/20">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2"
            stroke="currentColor" class="w-10 h-10">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </div>

        <h2 class="card-title text-4xl font-extrabold tracking-tight mb-2">Welcome Back</h2>
        <p class="text-lg opacity-60 mb-12 max-w-sm">Securely sign in to your project dashboard to manage your
          activities.</p>

        <button (click)="handleGoogleLogin()" class="btn btn-block h-12 text-lg flex items-center justify-center gap-4
         bg-base-content text-base-100 border-none
         hover:bg-base-content hover:brightness-125
         active:scale-95
         transition-all duration-200 font-semibold rounded-xl shadow-lg">

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-7 h-7">
            <path fill="#FFC107"
              d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z">
            </path>
            <path fill="#FF3D00"
              d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z">
            </path>
            <path fill="#4CAF50"
              d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z">
            </path>
            <path fill="#1976D2"
              d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z">
            </path>
          </svg>

          Continue with Google
        </button>

        <div class="mt-10 pt-6 border-t border-base-content/5 w-full">
          <p class="text-sm opacity-40">Identity verification powered by Google</p>
        </div>

      </div>
    </div>
  </div>
</app-main>
