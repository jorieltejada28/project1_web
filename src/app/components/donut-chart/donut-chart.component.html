<div class="card w-full bg-base-100 shadow-xl border border-base-300">
  <div class="card-body p-5">

    @if (title) {
    <div class="mb-4">
      <h2 class="card-title text-sm font-medium opacity-80">
        {{ title }}
      </h2>
    </div>
    }

    <app-loading-charts [isLoading]="isLoading()" [height]="height">
      <canvas #chartCanvas></canvas>
    </app-loading-charts>

  </div>
</div>
