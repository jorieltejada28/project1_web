<div class="navbar bg-base-200 shadow-sm w-full px-4 py-2">

  <div class="navbar-start gap-2">
    @if (session) {
    <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
      </svg>
    </div>
    } @else {
    <a class="btn btn-ghost text-xl font-black tracking-tighter hover:bg-transparent">
      <span class="text-primary">//</span>{{ appName }}
    </a>
    }
  </div>

  <div class="navbar-end gap-2">

    @if (session) {
    <button class="btn btn-ghost btn-circle transition-all duration-300">
      <div class="indicator">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span class="badge badge-xs badge-primary indicator-item ring-2 ring-base-200">1</span>
      </div>
    </button>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button"
        class="btn btn-sm h-10 px-3 bg-base-100 border-base-content/10 shadow-sm flex items-center gap-2 rounded-lg">
        <span class="text-[10px] uppercase opacity-60 font-bold tracking-widest">Theme:</span>
        <span class="text-xs font-medium">{{ currentTheme | titlecase }}</span>
        <svg width="12" height="12" class="opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
          <path fill="currentColor" d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z"></path>
        </svg>
      </div>

      <ul tabindex="0"
        class="dropdown-content mt-3 bg-base-100/95 backdrop-blur-md rounded-xl z-101 w-64 p-2 shadow-2xl border border-base-content/5 max-h-96 overflow-y-auto custom-scrollbar">
        <div class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-primary italic">Select Theme
        </div>
        @for (theme of themes; track theme) {
        <li>
          <input type="radio" name="theme-dropdown"
            class="theme-controller btn btn-ghost btn-sm justify-start text-xs font-semibold w-full" [value]="theme"
            [attr.aria-label]="theme | titlecase" [checked]="theme === currentTheme" (click)="changeTheme(theme)">
        </li>
        }
      </ul>
    </div>
    }
  </div>
</div>
