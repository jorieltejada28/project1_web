<div class="navbar bg-base-200 shadow-sm w-full rounded-md px-4">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
        </svg>
      </div>
    </div>
    <h1 class="text-lg font-bold ms-15">{{ appName }}</h1>
  </div>

  <div class="navbar-end">
    <div class="dropdown dropdown-end me-6">
      <div tabindex="0" role="button" class="btn btn-sm h-10 px-4 bg-base-100 border border-base-content/10 shadow-sm
           hover:bg-base-200 hover:border-base-content/20 transition-all duration-300
           flex items-center gap-3 font-medium tracking-wide">
        <span class="text-sm">{{ currentTheme | titlecase }}</span>
        <svg width="10" height="10" class="opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
          <path fill="currentColor" d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z"></path>
        </svg>
      </div>

      <ul tabindex="0" class="dropdown-content mt-2 bg-base-100/90 backdrop-blur-md rounded-lg z-100 w-56 p-1.5
           shadow-[0_10px_30px_-10px_rgba(0,0,0,0.3)] border border-base-content/5
           max-h-80 overflow-y-auto no-scrollbar">

        <div class="px-3 py-2 text-[10px] uppercase font-bold tracking-widest opacity-40">Select Aesthetic</div>

        @for (theme of themes; track theme) {
        <li class="mb-0.5 last:mb-0">
          <input type="radio" name="theme-dropdown" class="theme-controller btn btn-ghost btn-sm btn-block justify-start
               text-xs font-normal hover:bg-primary/10 hover:text-primary transition-colors" [value]="theme"
            [attr.aria-label]="theme | titlecase" [checked]="theme === currentTheme" (click)="changeTheme(theme)">
        </li>
        }
      </ul>
    </div>
  </div>
</div>
